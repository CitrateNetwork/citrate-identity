# Citrate Identity (auth.citrate.ai) — production compose for a Docker-on-VPS deploy.
#
# Services:
#   identity  — the OIDC authority (this repo), built from the Dockerfile.
#   postgres  — backs the KYC claim store (DATABASE_URL); named volume for durability.
#   redis     — backs the HA authority state (REDIS_URL): panva adapter, SIWE nonces,
#               and the logout session bus; named volume for AOF persistence.
#   caddy     — TLS-terminating reverse proxy (automatic HTTPS) in front of identity.
#               OPTIONAL: drop this service if your VPS already has its own ingress.
#
# Secrets are supplied via the environment (an .env file next to this compose, see
# .env.production.example), NEVER hardcoded here. Copy .env.production.example to
# .env, fill it in, then: `docker compose up -d --build`.

services:
  identity:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      ISSUER_URL: ${ISSUER_URL}
      COOKIE_KEYS: ${COOKIE_KEYS}
      EXPLORER_ORIGIN: ${EXPLORER_ORIGIN}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN}
      # memrizz RP (federated agent-memory webapp). Echoed for CORS + the memrizz
      # redirect origin; assertProductionConfig fails closed on a localhost value.
      MEMRIZZ_ORIGIN: ${MEMRIZZ_ORIGIN}
      # citrate-atlas RP (docs app, docs.citrate.ai). Echoed for CORS + the Atlas
      # redirect origin; assertProductionConfig fails closed on a localhost value.
      ATLAS_ORIGIN: ${ATLAS_ORIGIN}
      # citrate-comms-web RP (agentic team workspace, communications.citrate.ai —
      # the relay keeps comms.citrate.ai). Echoed for CORS + the comms-web redirect
      # origin; assertProductionConfig fails closed on a localhost value. Unset →
      # CORS for the prod domain is off (the vercel.app redirect still works as it
      # is hardcoded in the client's redirect_uris).
      COMMS_WEB_ORIGIN: ${COMMS_WEB_ORIGIN:-}
      # core-membership money-path RP canonical origin (membership.citrate.ai).
      CORE_MEMBERSHIP_ORIGIN: ${CORE_MEMBERSHIP_ORIGIN:-}
      STUDIO_ORIGIN: ${STUDIO_ORIGIN:-}
      WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:-}
      KYC_WEBHOOK_SECRET: ${KYC_WEBHOOK_SECRET}
      # Optional dedicated secret for the server-side /kyc/status re-check; falls
      # back to KYC_WEBHOOK_SECRET when unset (endpoint disabled if both unset).
      KYC_STATUS_SECRET: ${KYC_STATUS_SECRET:-}
      # Operator alert recipients when a KYC case parks in needs-review
      # (comma-separated). MUST be listed here: this service has an explicit
      # `environment:` map and NO env_file, so a var added only to .env never
      # reaches the container — verified the hard way on 2026-08-05, when the
      # address was set in .env, the service was recreated, and the alert stayed
      # silent because nothing passed it through. Unset => alerts off, by design.
      KYC_ALERT_EMAIL: ${KYC_ALERT_EMAIL:-}
      # American Learning Federation applicant flow. FEDERATION_ORIGIN is the
      # landing origin the alf OIDC client's /alf/callback + KYC return use — it
      # MUST be set to a non-local https origin in prod or assertProductionConfig
      # fail-closes on boot. ALF_ENROLL_SECRET guards POST /alf/enroll (fail-closed
      # 503 when unset). Both must be passed through here — there is no env_file.
      FEDERATION_ORIGIN: ${FEDERATION_ORIGIN:-}
      ALF_ENROLL_SECRET: ${ALF_ENROLL_SECRET:-}
      # Entitlements admin API shared secret (POST /admin/entitlements; fail-closed 503 when unset).
      # Must match core-membership's Vercel value so the grant's entitlement raise authenticates.
      ENTITLEMENTS_ADMIN_SECRET: ${ENTITLEMENTS_ADMIN_SECRET:-}
      # VERI in-house KYC provider. KYC_PROVIDER=inhouse turns on the server-blind
      # capture flow (/verify) + engine; requires KYC_MASTER_KEY + the two secrets
      # or assertProductionConfig fail-closes on boot. KYC_INFERENCE_URL points at
      # the self-hosted model service; when unset the engine fails closed to
      # needs-review (nothing auto-verifies). Sumsub removed (VERI-S5).
      KYC_PROVIDER: ${KYC_PROVIDER:-}
      KYC_MASTER_KEY: ${KYC_MASTER_KEY:-}
      KYC_SESSION_SECRET: ${KYC_SESSION_SECRET:-}
      KYC_INHOUSE_WEBHOOK_SECRET: ${KYC_INHOUSE_WEBHOOK_SECRET:-}
      KYC_CAPTURE_BASE_URL: ${KYC_CAPTURE_BASE_URL:-}
      KYC_INFERENCE_URL: ${KYC_INFERENCE_URL:-}
      KYC_INFERENCE_TOKEN: ${KYC_INFERENCE_TOKEN:-}
      KYC_ADMIN_SUBS: ${KYC_ADMIN_SUBS:-}
      # KYC confirmation email (same SMTP the landing/dataroom use). Unset → the
      # "you're verified" email is a logged no-op; verification itself still works.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # HTTPS email relay (works from the droplet, where SMTP egress is blocked): identity
      # POSTs the approval email to the landing site, which sends via the shared Office 365.
      KYC_EMAIL_RELAY_URL: ${KYC_EMAIL_RELAY_URL:-}
      KYC_EMAIL_RELAY_SECRET: ${KYC_EMAIL_RELAY_SECRET:-}
      CITRATE_RPC_URL: ${CITRATE_RPC_URL:-}
      # EW-S1 AA stack. When CITRATE_AA_FACTORY is set, `server.ts`
      # mounts `/aa/*` routes (predict address, enroll validator, list
      # validators) via `mountAaRoutes`. CITRATE_AA_KERNEL_IMPL is the
      # legacy alias for CITRATE_AA_WALLET_IMPL the AA config still
      # checks at boot.
      CITRATE_AA_ENTRY_POINT: ${CITRATE_AA_ENTRY_POINT:-}
      CITRATE_AA_FACTORY: ${CITRATE_AA_FACTORY:-}
      CITRATE_AA_WALLET_IMPL: ${CITRATE_AA_WALLET_IMPL:-}
      CITRATE_AA_KERNEL_IMPL: ${CITRATE_AA_KERNEL_IMPL:-${CITRATE_AA_WALLET_IMPL:-}}
      CITRATE_AA_PAYMASTER: ${CITRATE_AA_PAYMASTER:-}
      CITRATE_AA_WEBAUTHN_VALIDATOR: ${CITRATE_AA_WEBAUTHN_VALIDATOR:-}
      CITRATE_AA_ECDSA_VALIDATOR: ${CITRATE_AA_ECDSA_VALIDATOR:-}
      CITRATE_AA_GUARDIAN_RECOVERY: ${CITRATE_AA_GUARDIAN_RECOVERY:-}
      CITRATE_AA_IDENTITY_SIGNER_ADDR: ${CITRATE_AA_IDENTITY_SIGNER_ADDR:-}
      CITRATE_AA_IDENTITY_SIGNER_KEY: ${CITRATE_AA_IDENTITY_SIGNER_KEY:-}
      # Google federation. When BOTH are set, server.ts mounts /auth/google/*
      # and the interaction page renders the "Continue with Google" button
      # (else the Google tab shows a "not enabled" note). Redirect URI to
      # register in Google Cloud Console: ${ISSUER_URL}/auth/google/callback
      CITRATE_AA_GOOGLE_CLIENT_ID: ${CITRATE_AA_GOOGLE_CLIENT_ID:-}
      CITRATE_AA_GOOGLE_CLIENT_SECRET: ${CITRATE_AA_GOOGLE_CLIENT_SECRET:-}
      # Point the app at the in-network postgres/redis services. The credentials
      # come from the same env vars the postgres/redis services consume below.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      # Persist the generated RS256 JWKS across restarts/redeploys so issued tokens
      # keep verifying. Mount a host path or named volume; the container writes
      # /app/.keys/jwks.json on first boot if absent.
      - identity_keys:/app/.keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Not published to the host: Caddy terminates TLS and proxies to it over the
    # internal network. Expose to other compose services only.
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Require a password (--requirepass) and enable AOF persistence so authority
    # state survives a redis restart. REDIS_PASSWORD is supplied via the env file.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # OPTIONAL ingress. Remove this service if the VPS already fronts identity with
    # its own TLS/ingress (then publish identity's port instead).
    depends_on:
      identity:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The public issuer host Caddy obtains a cert for, e.g. auth.citrate.ai.
      ISSUER_HOST: ${ISSUER_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  identity_keys:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
